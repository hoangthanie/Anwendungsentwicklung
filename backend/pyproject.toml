[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-framework-backend"
version = "0.1.0"
description = "Backend (Pipeline-Schritte 1, 2, 4, Agent-Harness, run.py) des Dashboard-Frameworks"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
