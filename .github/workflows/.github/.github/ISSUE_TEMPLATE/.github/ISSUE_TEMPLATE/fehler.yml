name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["typ:bug"]
body:
  - type: textarea
    id: was
    attributes: { label: Was ist passiert?, description: Inkl. Fehlermeldung / Log-Ausschnitt }
    validations: { required: true }
  - type: textarea
    id: erwartet
    attributes: { label: Was wurde erwartet? }
  - type: textarea
    id: schritte
    attributes: { label: Schritte zum Nachstellen, placeholder: "1. …\n2. …" }
  - type: input
    id: version
    attributes: { label: Commit / Release / Artefakt }
