name: Arbeitspaket / Aufgabe
description: Neue Aufgabe mit Bezug zum PSP
title: "[PSP x.y] "
body:
  - type: input
    id: psp
    attributes:
      label: PSP-Code
      placeholder: "z. B. 5.4"
    validations:
      required: true
  - type: textarea
    id: inhalt
    attributes:
      label: "Was ist zu tun?"
      description: "Ergebnisorientiert formulieren – was liegt am Ende vor?"
    validations:
      required: true
  - type: textarea
    id: abnahme
    attributes:
      label: Abnahmekriterium
      description: "Woran erkennen wir, dass es fertig ist? (aus PSP bzw. User Story)"
    validations:
      required: true
  - type: input
    id: aufwand
    attributes:
      label: "Geschätzter Aufwand (h)"
  - type: dropdown
    id: ki
    attributes:
      label: "KI-Einsatz geplant?"
      options:
        - "Nein"
        - "Ja – Prompt-Verzeichnis pflegen"
