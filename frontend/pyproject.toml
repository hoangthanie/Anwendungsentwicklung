[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-framework-frontend"
version = "0.1.0"
description = "Frontend (Eingabe-App und Dashboard-Runner) des Dashboard-Frameworks"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]  # "tests": damit 'import fakes' in jedem Testordner funktioniert
testpaths = ["tests"]
