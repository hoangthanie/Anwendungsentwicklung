[server]
# Streamlit erlaubt standardmäßig 200 MB pro Upload. Unser Limit ist 5 MB (framework_lib.MAX_UPLOAD_BYTES);
# so lehnt schon der Server zu große Dateien ab, bevor sie in den Arbeitsspeicher gelesen werden. Wert in MB.
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
# Firmenfarben sind für helle Hintergründe gestaltet (z. B. dunkles Marineblau). Auf einem dunklen Theme wären sie schlecht lesbar,
# deshalb ist das helle Theme fest eingestellt und folgt nicht der Betriebssystem-Einstellung des Betrachters.
base = "light"
